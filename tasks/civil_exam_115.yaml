    「團體認同可能只是個暫時性現象。人們會換工作、搬家，有時候還會移民。不過對於先前所屬團體的集體情緒，往往在我們不再屬於那個曾認同的團體之後，還會持續下去。那是因為團體以及構成團體的個人，他們的集體理性情緒如果是無條件而且無從改變的，那麼他們從中獲得的優勢，某個程度來說就會放大。倘若少了這些特質，團體就不太能對敵對團體構成威脅。」根據上文，下列選項何者正確？
    A. 人們因換工作或搬家、移民，將會失去曾認同團體的情緒
    B. 我們不屬於該團體，也將因該團體的集體情緒而獲得認同
    C. 團體認同只是暫時性的現象，團體不必過於在乎形塑認同
    D. 團體內部無條件的團體認同，往往可對其他團體構成威脅
