    expected: C
- id: '115010_1501_028'
  category: 初考國文
  prompt: |
    請回答下列單選題，只回答選項字母（A/B/C/D），不要有其他文字。

    「所謂生物塑膠並沒有統一的定義，生物塑膠包括了『生物基質塑膠』以及『生物可分解塑膠』。生物基質塑膠是指由生物質資源（例如糖，澱粉，植物油和植物材質）製成的塑膠，並再分成『生物可分解』以及『不可生物分解』兩種。『生物可分解』一般表示在某些嚴苛的環境條件下這樣的物質可以在一定期限內被微生物分解，另外一種『生物可分解塑膠』為『生物可堆肥塑膠』，指分解過程將產生堆肥或腐殖質，可以與有機廢物一起添加到工業堆肥中。」下列選項，可明確從文章敘述得知的是：
    A. 生物可分解塑膠分解後可產生堆肥，也可添加到工業堆肥
    B. 生物可分解塑膠可以在任何環境下自然分解
    C. 生物塑膠的生產過程完全不依賴石化材料
    D. 所有生物塑膠都是可分解的
  grading:
    type: multiple_choice
    expected: A
- id: '115010_1501_029'
  category: 初考國文
  prompt: |
