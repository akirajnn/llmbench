    「過去我們總想盡辦法阻止洪水發生，堤防越蓋越高，人與環境的關係越來越疏遠，危機意識也變得越加薄弱，以致不知該如何面對越發頻繁的淹水。其實大至政府調整治水預算的方式，小至生活中推廣與水共生的環境教育，你我都可以施展一己之力。當我們培養了這種『承洪韌性』，同樣也可以建立起面對高溫、乾旱，乃至各種極端氣候變遷的韌性。」根據上文，下列敘述最適當的選項是：
