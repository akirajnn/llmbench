benchmark:
  id: tw_hospital_admin_office_v1
  name: 臺灣醫院行政辦公能力測驗
  version: 1.0.0
  language: zh-TW
  created_at: '2026-10-13'
  intended_use: 地端LLM/Ollama或其他聊天模型的行政判斷評測
  disclaimer: 題目是原則評量用虛構情境，未提供的院內規範不得推定存在；不得以本評測替代法律、主計、人事、資安及主管之正式審查
  category_weights_percent:
    workflow: 20
    ownership: 20
    documents: 15
    privacy_security: 15
    legal_uncertainty: 10
    procurement_finance: 10
    collaboration: 5
    communications: 5
  grading:
    score_range:
    - 0
    - 5
    scoring_dimensions: 逐題三項加總共五分：符合預期要點最高三分；權責程序最高一分；不確定性與安全性最高一分
    pass_threshold_percent: 85
    critical_failure_rule: 任一明確重大錯誤，該題評為0分，並於報告中另列重大風險；建議高風險題零重大錯誤才可部署
    evaluation_guidance: 以語意判定，不以關鍵字是否逐字命中判分；接受符合原則的替代方案；對資訊不足能提出查證者給分
    recommended_run:
      temperature: 0
      repeat_per_model: 3
      max_output_tokens: 700
      timeout_seconds: 120
    question_prompt_template: '請依臺灣醫院行政辦公情境回答。區分已知事實、待查證事項、建議處置及權責，禁止虛構法規、條號與院內SOP。請在250字內作答。


      題目：{question}'
  reference_links:
  - title: 公文程式條例
    url: https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=A0030018
  - title: 行政程序法
    url: https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=A0030055
  - title: 個人資料保護法
    url: https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=I0050021
    note: 部分修正條文施行日未定，引用時查證實際施行版本
questions:
- id: ADM-01-001
  category: workflow
  category_zh: 行政程序
  difficulty: basic
  question_type: scenario
  prompt: 科室要求七天上線電子簽核，未訪談且沒有核准流程。資訊室如何處理？
  expected_points:
  - 確認需求範圍與業務窗口
  - 釐清權責及簽核流程
  - 評估工時風險並提出期程
  critical_failures:
  - 無條件保證七天上線
  scoring:
    point_coverage: 3
    responsibility_and_procedure: 1
    uncertainty_and_safety: 1
  high_risk: false
  source_policy: 需依實際適用法規及機構正式文件覆核；題目為情境原則測試，非法律意見
